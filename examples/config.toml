# fanctl - business logic: zones, curves, coupling
#
# Semantics only. Pin names and sensor names are resolved through platform.toml;
# they are matched case-insensitively. Documented in docs/config.md; validate with
# `fanctl check`.

[global]
interval_seconds = 10        # sampling period (seconds)
min_duty_cycle = 25          # hard floor, fans never stop
max_duty_cycle = 100         # hard ceiling
fallback_duty_cycle = 60     # used when a zone cannot read its sensors at all

# The keys below are the shared policy: a zone that omits any of them
# inherits the value written here. Repeat a key inside a zone to override it.
default_duty_cycle = 30      # standby, below the first threshold
debounce_celsius = 2         # hysteresis applied only when dropping a step
aggregation = "max"          # max or mean
fallback_after_cycles = 2    # cycles without a reading before falling back
# command_timeout_seconds = 10 # deadline for one ipmitool invocation (default 10)

# A zone may also override the blind value itself. A water pump is the case that
# matters: it must keep running when the BMC stops answering.
#   default_duty_cycle = 100
#   fallback_duty_cycle = 100
#   fallback_after_cycles = 1

# On SIGINT/SIGTERM each pin is set back to its zone's default_duty_cycle, so
# the BMC does not keep the last (possibly 100 %) value. Pins no zone drives
# are left untouched.

# --- coupling: case fans must never be slower than the CPU fan --------------
[[follows]]
pin = "SYS_FAN_1"
min_of = "CPU_FAN"

[[follows]]
pin = "SYS_FAN_2"
min_of = "CPU_FAN"

# --- zone 1: CPU heatsink ---------------------------------------------------
[[zones]]
name = "cpu_zone"
monitor_sources = ["CPU_Tctl"]
target_pins = ["CPU_FAN"]

[[zones.thresholds]]
temperature = 55
duty_cycle = 40

[[zones.thresholds]]
temperature = 70
duty_cycle = 60

[[zones.thresholds]]
temperature = 85
duty_cycle = 100

# --- zone 2: intake, feeds the heatsink and the GPUs ------------------------
[[zones]]
name = "intake_zone"
monitor_sources = ["CPU_Tctl", "GPU"]   # highest of CPU and all GPUs
target_pins = ["SYS_FAN_1"]

[[zones.thresholds]]
temperature = 60
duty_cycle = 45

[[zones.thresholds]]
temperature = 75
duty_cycle = 65

# --- zone 3: exhaust, clears VRM and case heat ------------------------------
[[zones]]
name = "exhaust_zone"
monitor_sources = ["CPU_Tctl", "CPU_MOSFET", "SYS_Air_Outlet"]
target_pins = ["SYS_FAN_2"]

[[zones.thresholds]]
temperature = 55
duty_cycle = 40

[[zones.thresholds]]
temperature = 70
duty_cycle = 60
