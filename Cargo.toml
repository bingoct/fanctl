[package]
name = "fanctl"
version = "0.1.0"
edition = "2021"
# Floor imposed by `resolver = "3"` (the MSRV-aware resolver), not by a
# language feature: an older cargo cannot even parse this manifest.
rust-version = "1.84"
resolver = "3"
description = "Hardware-agnostic IPMI fan control daemon for server boards"
keywords = ["ipmi", "fan", "daemon", "server", "pwm"]
categories = ["command-line-utilities", "hardware-support"]
readme = "README.md"

[dependencies]
# No `color`: fanctl runs in the background, its output goes to journald, and
# the ANSI machinery (anstream/anstyle) is a measurable share of the binary.
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
nvml-wrapper = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["gpu"]
# NVIDIA temperature support. Disable with `--no-default-features` on hosts
# without the NVIDIA driver: the control loop then ignores `monitor_sources = ["GPU"]`.
gpu = ["dep:nvml-wrapper"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
# A panic here is a bug, not a recoverable state: nothing in this crate catches
# an unwind (`catch_unwind` is absent, production code has no `unwrap`), so the
# only thing unwinding ever bought was a symbolised backtrace. Aborting instead
# drops every cleanup landing pad plus the `.eh_frame`/`.gcc_except_table`
# tables - measured at 29 % of the binary on a PE build.
#
# Losing the backtrace is the real cost. When one is needed:
#   cargo build --release --config 'profile.release.panic="unwind"'
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"

[lints.clippy]
all = "warn"
